{% extends "base.html" %}
{% load static %}
{% block title %}Главная — SportPartner Finde{% endblock %}
{% block content %}
<div class="p-5 mb-4 bg-light rounded-3 text-center hero-banner">
    <img src="{% static 'homepage/img/logo.png' %}" alt="Logo" class="project-logo mb-3">
    <h1 class="display-5 fw-bold">SportPartner Finde</h1>
    <p class="col-md-8 fs-4 mx-auto">Платформа для совместных тренировок, поиска спарринг-партнеров и спортивных событий.</p>
    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center mt-3">
        <a href="{% url 'events:list' %}" class="btn btn-primary btn-lg px-4 gap-3">Найти тренировку</a>
        <a href="{% url 'requests:list' %}" class="btn btn-outline-secondary btn-lg px-4">Список заявок</a>
    </div>
</div>
{% endblock %}
